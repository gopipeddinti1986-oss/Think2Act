version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: think2act-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: think2act
      POSTGRES_PASSWORD: think2act_password
      POSTGRES_DB: think2act_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U think2act -d think2act_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: think2act-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://think2act:think2act_password@postgres:5432/think2act_db
      - JWT_SECRET=think2act_super_secret_jwt_key_2026_change_in_prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: think2act-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
